<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Decision paths converge and remain open to evidence</title>
  <desc id="desc">Several possible paths converge at a decision hinge. One main path continues, an optional dashed branch stays conditional, and a real-world evidence loop returns for reassessment.</desc>
  <rect width="1200" height="480" rx="36" fill="#0F1722"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#AAB6C5" stroke-width="7">
      <path id="input-1" d="M72 96 C210 96 284 166 430 214"/>
      <path id="input-2" d="M72 176 C222 176 308 202 430 226"/>
      <path id="input-3" d="M72 278 C224 278 308 252 430 238"/>
      <path id="input-4" d="M72 368 C220 368 294 296 430 250"/>
    </g>
    <path id="main-path" d="M510 232 C652 232 732 174 884 174 C984 174 1052 190 1128 190" stroke="#E7EDF5" stroke-width="13"/>
    <path id="optional-gate" d="M598 229 C678 294 776 314 900 300" stroke="#E0B46A" stroke-width="7" stroke-dasharray="15 16"/>
    <path id="reassessment-loop" d="M1068 208 C1100 330 986 390 804 386 C620 382 542 322 484 273" stroke="#6FD3C2" stroke-width="9"/>
  </g>
  <g id="decision-hinge">
    <path d="M448 194 C467 174 498 174 518 194 L540 216 C550 226 550 242 540 252 L518 274 C498 294 467 294 448 274 L426 252 C416 242 416 226 426 216 Z" fill="#0F1722" stroke="#6FD3C2" stroke-width="10"/>
    <path d="M480 194 L480 226 L512 226" fill="none" stroke="#6FD3C2" stroke-width="9" stroke-linecap="round"/>
    <circle cx="486" cy="246" r="7" fill="#6FD3C2"/>
  </g>
  <g id="gate-marker" fill="#0F1722" stroke="#E0B46A" stroke-width="6">
    <path d="M738 283 L758 303 L738 323 L718 303 Z"/>
  </g>
  <g id="evidence-marker" fill="#6FD3C2">
    <circle cx="804" cy="386" r="9"/>
    <circle cx="960" cy="365" r="6"/>
  </g>
</svg>
