<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">想清楚如何从一个议题走到现实复判</title>
  <desc id="desc">四个主步骤从说出议题走到判断和现实验证。只有必要且明确授权时，才进入可选的证据或参与支路；观察到的现实结果会带回复判。</desc>
  <style>
    .title { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .body { font: 400 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526176; }
    .small { font: 600 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #315F6D; }
    .card { fill: #FFFFFF; stroke: #AAB4C0; stroke-width: 2; }
    .accent { fill: #E9F6F3; stroke: #0F766E; stroke-width: 3; }
    .gate { fill: #FFF4E5; stroke: #8A5A22; stroke-width: 3; stroke-dasharray: 9 7; }
    .path { fill: none; stroke: #556274; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .loop { fill: none; stroke: #0F766E; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .number { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
  </style>
  <rect width="1200" height="520" rx="28" fill="#F7F5EF"/>
  <path class="path" d="M278 186 H326 M554 186 H602 M830 186 H878"/>
  <path class="path" d="M714 278 V322" stroke-dasharray="9 7"/>
  <path id="reassessment-loop" class="loop" d="M992 278 C1000 428 820 458 620 450 C440 443 318 400 250 300"/>
  <path class="loop" d="M250 300 L238 322 M250 300 L272 309"/>

  <g id="step-1">
    <rect class="card" x="50" y="86" width="228" height="200" rx="22"/>
    <circle cx="84" cy="122" r="18" fill="#556274"/><text class="number" x="84" y="123">1</text>
    <text class="title" x="76" y="174">说出正在考虑的事</text>
    <text class="body" x="76" y="208">一个选择、计划，</text>
    <text class="body" x="76" y="234">或只是觉得哪里</text>
    <text class="body" x="76" y="260">不对，都可以开始。</text>
  </g>

  <g id="step-2">
    <rect class="card" x="326" y="86" width="228" height="200" rx="22"/>
    <circle cx="360" cy="122" r="18" fill="#556274"/><text class="number" x="360" y="123">2</text>
    <text class="title" x="352" y="174">说清真正重要的结果</text>
    <text class="body" x="352" y="208">把眼前任务与真正</text>
    <text class="body" x="352" y="234">想得到或保护的东西</text>
    <text class="body" x="352" y="260">分开。</text>
  </g>

  <g id="step-3">
    <rect class="accent" x="602" y="86" width="228" height="200" rx="22"/>
    <circle cx="636" cy="122" r="18" fill="#0F766E"/><text class="number" x="636" y="123">3</text>
    <text class="title" x="628" y="174">只回答一个问题</text>
    <text class="body" x="628" y="208">聚焦最可能改变方向、</text>
    <text class="body" x="628" y="234">排序或投入边界的</text>
    <text class="body" x="628" y="260">一个答案。</text>
  </g>

  <g id="step-4">
    <rect class="card" x="878" y="86" width="272" height="200" rx="22"/>
    <circle cx="912" cy="122" r="18" fill="#556274"/><text class="number" x="912" y="123">4</text>
    <text class="title" x="904" y="174">得到判断和现实验证</text>
    <text class="body" x="904" y="208">拿到一个方向、一个</text>
    <text class="body" x="904" y="234">现实证据闭环和一份</text>
    <text class="body" x="904" y="260">可复制的决策快照。</text>
  </g>

  <g id="optional-gate">
    <rect class="gate" x="538" y="322" width="352" height="88" rx="20"/>
    <text class="title" x="566" y="358">可选的证据或独立参与</text>
    <text class="small" x="566" y="386">仅在必要且获得明确授权时进入</text>
  </g>

  <text class="small" x="914" y="444">带着现实结果回来复判</text>
</svg>
