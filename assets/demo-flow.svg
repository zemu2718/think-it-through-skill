<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Think It Through interaction flow</title>
  <desc id="desc">A topic moves through Recommend, Analyze, and Judge. The user confirms the analysis before one decision-changing question, then receives one bounded reversible next step.</desc>
  <defs>
    <style>
      .bg { fill: #f7f3ea; }
      .ink { fill: #14243a; }
      .muted { fill: #526176; }
      .card { fill: #fffdf8; stroke: #ccd4dc; stroke-width: 2; }
      .accent-card { fill: #fff6f1; stroke: #ef7457; stroke-width: 3; }
      .line { fill: none; stroke: #8290a2; stroke-width: 3; stroke-linecap: round; }
      .accent-line { fill: none; stroke: #ef7457; stroke-width: 4; stroke-linecap: round; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .heading { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8290a2"/>
    </marker>
    <marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef7457"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="420" rx="28"/>

  <text class="heading ink" x="56" y="62">One decision. Three deliberate stages.</text>
  <text class="body muted" x="56" y="94">The user keeps control at every waiting boundary.</text>

  <path class="line" d="M342 228 H423" marker-end="url(#arrow)"/>
  <path class="accent-line" d="M736 228 H817" marker-end="url(#accent-arrow)"/>

  <g transform="translate(56 134)">
    <rect class="card" width="286" height="188" rx="22"/>
    <circle cx="42" cy="42" r="22" fill="#14243a"/>
    <text class="label" x="35" y="50" fill="#fffdf8">R</text>
    <text class="heading ink" x="78" y="52">Recommend</text>
    <text class="body muted" x="28" y="96">Reframe the real decision.</text>
    <text class="body muted" x="28" y="126">Offer the smallest useful</text>
    <text class="body muted" x="28" y="156">analysis, then wait.</text>
  </g>

  <g transform="translate(450 134)">
    <rect class="accent-card" width="286" height="188" rx="22"/>
    <circle cx="42" cy="42" r="22" fill="#ef7457"/>
    <text class="label" x="34" y="50" fill="#fffdf8">A</text>
    <text class="heading ink" x="78" y="52">Analyze</text>
    <text class="body muted" x="28" y="96">Run only confirmed methods.</text>
    <text class="body muted" x="28" y="126">Find the key variable.</text>
    <text class="small" x="28" y="160" fill="#d9573c">Ask exactly one question ?</text>
  </g>

  <g transform="translate(844 134)">
    <rect class="card" width="300" height="188" rx="22"/>
    <circle cx="42" cy="42" r="22" fill="#14243a"/>
    <text class="label" x="35" y="50" fill="#fffdf8">B</text>
    <text class="heading ink" x="78" y="52">Judge</text>
    <text class="body muted" x="28" y="96">Absorb the answer.</text>
    <text class="body muted" x="28" y="126">Give one conditional judgment</text>
    <text class="body muted" x="28" y="156">and one bounded next step.</text>
  </g>

  <path class="line" d="M593 330 C593 376 205 380 205 326" marker-end="url(#arrow)"/>
  <text class="small muted" x="346" y="390">Change the topic or methods → return to R</text>
</svg>
