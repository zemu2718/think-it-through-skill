<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How Think It Through moves from an issue to reassessment</title>
  <desc id="desc">Four main steps move from sharing an issue to a judgment and real-world check. An optional evidence or participation branch appears only when needed and authorized, and observed results return for reassessment.</desc>
  <style>
    .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .body { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526176; }
    .small { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #315F6D; }
    .card { fill: #FFFFFF; stroke: #AAB4C0; stroke-width: 2; }
    .accent { fill: #E9F6F3; stroke: #0F766E; stroke-width: 3; }
    .gate { fill: #FFF4E5; stroke: #8A5A22; stroke-width: 3; stroke-dasharray: 9 7; }
    .path { fill: none; stroke: #556274; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .loop { fill: none; stroke: #0F766E; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .number { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
  </style>
  <rect width="1200" height="520" rx="28" fill="#F7F5EF"/>
  <path class="path" d="M278 186 H326 M554 186 H602 M830 186 H878"/>
  <path class="path" d="M714 278 V322" stroke-dasharray="9 7"/>
  <path id="reassessment-loop" class="loop" d="M992 278 C1000 428 820 458 620 450 C440 443 318 400 250 300"/>
  <path class="loop" d="M250 300 L238 322 M250 300 L272 309"/>

  <g id="step-1">
    <rect class="card" x="50" y="86" width="228" height="200" rx="22"/>
    <circle cx="84" cy="122" r="18" fill="#556274"/><text class="number" x="84" y="123">1</text>
    <text class="title" x="76" y="174">Share one issue</text>
    <text class="body" x="76" y="208">A choice, plan, or</text>
    <text class="body" x="76" y="234">sense that something</text>
    <text class="body" x="76" y="260">is off is enough.</text>
  </g>

  <g id="step-2">
    <rect class="card" x="326" y="86" width="228" height="200" rx="22"/>
    <circle cx="360" cy="122" r="18" fill="#556274"/><text class="number" x="360" y="123">2</text>
    <text class="title" x="352" y="174">Clarify what matters</text>
    <text class="body" x="352" y="208">Separate the requested</text>
    <text class="body" x="352" y="234">task from the result</text>
    <text class="body" x="352" y="260">you want to protect.</text>
  </g>

  <g id="step-3">
    <rect class="accent" x="602" y="86" width="228" height="200" rx="22"/>
    <circle cx="636" cy="122" r="18" fill="#0F766E"/><text class="number" x="636" y="123">3</text>
    <text class="title" x="628" y="174">Answer one thing</text>
    <text class="body" x="628" y="208">Focus on the answer</text>
    <text class="body" x="628" y="234">most likely to change</text>
    <text class="body" x="628" y="260">the decision.</text>
  </g>

  <g id="step-4">
    <rect class="card" x="878" y="86" width="272" height="200" rx="22"/>
    <circle cx="912" cy="122" r="18" fill="#556274"/><text class="number" x="912" y="123">4</text>
    <text class="title" x="904" y="174">Judge and check reality</text>
    <text class="body" x="904" y="208">Get a direction, one</text>
    <text class="body" x="904" y="234">real-world evidence loop,</text>
    <text class="body" x="904" y="260">and a decision snapshot.</text>
  </g>

  <g id="optional-gate">
    <rect class="gate" x="538" y="322" width="352" height="88" rx="20"/>
    <text class="title" x="566" y="358">Optional evidence or participation</text>
    <text class="small" x="566" y="386">Only when needed and explicitly authorized</text>
  </g>

  <text class="small" x="914" y="444">Bring real results back to reassess</text>
</svg>
