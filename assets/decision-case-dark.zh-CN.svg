<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">同一个 SaaS 请求，两条完全不同的路径</title>
  <desc id="desc">这个合成案例对比两条路径：继续开发和准备投放材料仍无法回答陌生客户是否愿意付费；先判断是否值得继续投入，则用现实行为检验付费意愿，再根据结果复判。</desc>
  <rect width="1200" height="680" rx="28" fill="#0B1117"/>
  <path d="M64 88 H1136" fill="none" stroke="#29333C" stroke-width="2"/>
  <text x="64" y="59" fill="#E8ECEF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="2">同一个请求 · 两条路径</text>
  <g id="synthetic-label">
    <rect x="934" y="31" width="202" height="38" rx="19" fill="#182129"/>
    <text x="1035" y="57" text-anchor="middle" fill="#9AA4AE" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">说明性合成案例</text>
  </g>
  <g id="surface-request" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="64" y="208" width="306" height="164" rx="24" fill="#121A22" stroke="#39444D" stroke-width="2"/>
    <text x="92" y="246" fill="#8894A0" font-size="16" font-weight="700" letter-spacing="1.5">表面请求</text>
    <text x="92" y="294" fill="#E8ECEF" font-size="27" font-weight="700">继续开发 SaaS</text>
    <text x="92" y="331" fill="#E8ECEF" font-size="27" font-weight="700">＋ 写投放方案</text>
  </g>
  <g id="execution-first-path" font-family="ui-sans-serif, system-ui, sans-serif">
    <path d="M370 253 C458 253 477 151 584 151 H1090" fill="none" stroke="#68737D" stroke-width="5" stroke-linecap="round"/>
    <path d="M1074 139 L1092 151 L1074 163" fill="none" stroke="#68737D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="604" y="126" fill="#9AA4AE" font-size="16" font-weight="700" letter-spacing="1.5">先执行任务</text>
    <text x="604" y="178" fill="#BBC2C8" font-size="25" font-weight="650">得到更多功能和投放材料</text>
    <text x="604" y="213" fill="#8894A0" font-size="22">陌生客户是否愿意付费，仍然未知</text>
    <circle cx="1091" cy="151" r="8" fill="#0B1117" stroke="#68737D" stroke-width="4"/>
  </g>
  <g id="decision-hinge">
    <path d="M439 257 C449 247 465 247 475 257 L504 286 C511 293 511 305 504 312 L475 341 C465 351 449 351 439 341 L410 312 C403 305 403 293 410 286 Z" fill="#0B1117" stroke="#58C7B5" stroke-width="8"/>
    <path d="M455 258 V294 H486" fill="none" stroke="#58C7B5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="458" cy="313" r="5" fill="#58C7B5"/>
  </g>
  <g id="decision-first-path" font-family="ui-sans-serif, system-ui, sans-serif">
    <path d="M504 300 C574 300 587 425 678 425 H1091" fill="none" stroke="#58C7B5" stroke-width="9" stroke-linecap="round"/>
    <path d="M1071 411 L1093 425 L1071 439" fill="none" stroke="#58C7B5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="604" y="294" fill="#58C7B5" font-size="16" font-weight="700" letter-spacing="1.5">先想清楚决定</text>
    <text x="604" y="338" fill="#E8ECEF" font-size="29" font-weight="700">现在是否值得继续投入？</text>
    <text x="604" y="376" fill="#B7C0C7" font-size="23">先让现实行为回答真实付费意愿。</text>
  </g>
  <g id="optional-gate" font-family="ui-sans-serif, system-ui, sans-serif" stroke-dasharray="9 9">
    <path d="M550 328 C570 370 553 415 520 452" fill="none" stroke="#D3A051" stroke-width="4" stroke-dasharray="9 10" stroke-linecap="round"/>
    <rect x="370" y="449" width="226" height="62" rx="31" fill="#0B1117" stroke="#D3A051" stroke-width="3" stroke-dasharray="9 9"/>
    <path d="M397 469 L408 480 L397 491 L386 480 Z" fill="none" stroke="#D3A051" stroke-width="3"/>
    <text x="423" y="486" fill="#D3A051" font-size="17" font-weight="650">只在有增量时可选</text>
  </g>
  <g id="outcome-set" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="704" y="478" fill="#8894A0" font-size="16" font-weight="700" letter-spacing="1.5">未来信号 → 重新决定</text>
    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="704" y="500" width="102" height="44" rx="22" fill="#173B37"/><text x="755" y="528" fill="#73D2C2">继续</text>
      <rect x="818" y="500" width="94" height="44" rx="22" fill="#182129"/><text x="865" y="528" fill="#A8B1B9">调整</text>
      <rect x="924" y="500" width="86" height="44" rx="22" fill="#182129"/><text x="967" y="528" fill="#A8B1B9">暂停</text>
      <rect x="1022" y="500" width="90" height="44" rx="22" fill="#182129"/><text x="1067" y="528" fill="#A8B1B9">停止</text>
    </g>
  </g>
  <g fill="none" stroke="#58C7B5" stroke-linecap="round" stroke-linejoin="round">
    <path id="reassessment-loop" d="M1096 452 C1134 575 921 611 690 594 C538 583 468 514 458 350" stroke-width="6"/>
    <path d="M445 369 L458 348 L473 368" stroke-width="6"/>
  </g>
  <text x="64" y="629" fill="#8894A0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">本案例不预设结果、指标、样本量、价格或期限。</text>
</svg>
