<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">One SaaS request, two very different paths</title>
  <desc id="desc">A synthetic case contrasts executing more SaaS development and launch work while buyer willingness remains unknown with first deciding whether continued investment is worthwhile, testing willingness through real behavior, and reassessing from the result.</desc>
  <rect width="1200" height="680" rx="28" fill="#F5F4EF"/>
  <path d="M64 88 H1136" fill="none" stroke="#D9DEDC" stroke-width="2"/>
  <text x="64" y="59" fill="#172033" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="2">ONE REQUEST · TWO PATHS</text>
  <g id="synthetic-label">
    <rect x="934" y="31" width="202" height="38" rx="19" fill="#ECEDE8"/>
    <text x="1035" y="57" text-anchor="middle" fill="#5F6A74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">SYNTHETIC CASE</text>
  </g>
  <g id="surface-request" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="64" y="208" width="306" height="164" rx="24" fill="#FFFFFF" stroke="#C9D0D2" stroke-width="2"/>
    <text x="92" y="246" fill="#616C76" font-size="16" font-weight="700" letter-spacing="1.5">SURFACE REQUEST</text>
    <text x="92" y="294" fill="#172033" font-size="27" font-weight="700">Keep building the SaaS</text>
    <text x="92" y="331" fill="#172033" font-size="27" font-weight="700">+ write the launch plan</text>
  </g>
  <g id="execution-first-path" font-family="ui-sans-serif, system-ui, sans-serif">
    <path d="M370 253 C458 253 477 151 584 151 H1090" fill="none" stroke="#9AA3AA" stroke-width="5" stroke-linecap="round"/>
    <path d="M1074 139 L1092 151 L1074 163" fill="none" stroke="#9AA3AA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="604" y="126" fill="#5F6A74" font-size="16" font-weight="700" letter-spacing="1.5">EXECUTION FIRST</text>
    <text x="604" y="178" fill="#4E5965" font-size="25" font-weight="650">More features and launch material</text>
    <text x="604" y="213" fill="#616C76" font-size="22">Buyer willingness to pay stays unknown</text>
    <circle cx="1091" cy="151" r="8" fill="#F5F4EF" stroke="#9AA3AA" stroke-width="4"/>
  </g>
  <g id="decision-hinge" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M458 248 C490 248 512 270 512 299 C512 321 501 334 491 347 V350" stroke="#626A67" stroke-width="7"/>
    <path d="M458 260 C482 260 500 277 500 299 C500 315 492 325 484 336 V350" stroke="#929793" stroke-width="6"/>
    <path d="M458 270 C442 270 430 283 430 299 C430 311 437 319 445 328 V350 H477 V328 C485 319 492 311 492 299 C492 283 478 270 458 270 Z" fill="#F5F4EF" stroke="#0F766E" stroke-width="7"/>
    <path d="M458 276 C474 276 486 286 486 299 C486 309 480 316 472 326 V346" stroke="#0F766E" stroke-width="5"/>
    <circle cx="461" cy="336" r="5" fill="#A66A25" stroke="#F5F4EF" stroke-width="2"/>
  </g>
  <g id="decision-first-path" font-family="ui-sans-serif, system-ui, sans-serif">
    <path d="M504 300 C574 300 587 425 678 425 H1091" fill="none" stroke="#0F766E" stroke-width="9" stroke-linecap="round"/>
    <path d="M1071 411 L1093 425 L1071 439" fill="none" stroke="#0F766E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="604" y="294" fill="#0F766E" font-size="16" font-weight="700" letter-spacing="1.5">DECISION FIRST</text>
    <text x="604" y="338" fill="#172033" font-size="29" font-weight="700">Is continued investment worth it?</text>
    <text x="604" y="376" fill="#45525D" font-size="23">Let real behavior answer willingness to pay.</text>
  </g>
  <g id="optional-gate" font-family="ui-sans-serif, system-ui, sans-serif" stroke-dasharray="9 9">
    <path d="M550 328 C570 370 553 415 520 452" fill="none" stroke="#A66A25" stroke-width="4" stroke-dasharray="9 10" stroke-linecap="round"/>
    <rect x="370" y="449" width="226" height="62" rx="31" fill="#F5F4EF" stroke="#A66A25" stroke-width="3" stroke-dasharray="9 9"/>
    <path d="M397 469 L408 480 L397 491 L386 480 Z" fill="none" stroke="#A66A25" stroke-width="3"/>
    <text x="423" y="486" fill="#81531F" font-size="17" font-weight="650">Optional, when useful</text>
  </g>
  <g id="outcome-set" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="704" y="478" fill="#616C76" font-size="16" font-weight="700" letter-spacing="1.5">FUTURE SIGNAL → REDECIDE</text>
    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="704" y="500" width="102" height="44" rx="22" fill="#E3F2EE"/><text x="755" y="528" fill="#0F665F">CONTINUE</text>
      <rect x="818" y="500" width="94" height="44" rx="22" fill="#ECEDE8"/><text x="865" y="528" fill="#59646E">ADJUST</text>
      <rect x="924" y="500" width="86" height="44" rx="22" fill="#ECEDE8"/><text x="967" y="528" fill="#59646E">PAUSE</text>
      <rect x="1022" y="500" width="90" height="44" rx="22" fill="#ECEDE8"/><text x="1067" y="528" fill="#59646E">STOP</text>
    </g>
  </g>
  <g fill="none" stroke="#0F766E" stroke-linecap="round" stroke-linejoin="round">
    <path id="reassessment-loop" d="M1096 452 C1134 575 921 611 690 594 C538 583 468 514 458 350" stroke-width="6"/>
    <path d="M445 369 L458 348 L473 368" stroke-width="6"/>
  </g>
  <text x="64" y="629" fill="#5F6A74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">The case defines no result, metric, sample size, price, or deadline.</text>
</svg>
