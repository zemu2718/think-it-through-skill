name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Contracts and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run contract grader tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Ensure checks do not modify tracked files
        run: git diff --exit-code
