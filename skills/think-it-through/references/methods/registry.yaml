version: "0.1.5"
selection_policy:
  basic_analysis_always: true
  optional_methods_min: 0
  optional_methods_max: 3
  specialist_methods_typical_max: 1
  zero_specialist_is_valid: true
  require_current_turn_confirmation: true
methods:
  - id: object-calibration
    name: 对象校准
    user_explanation: 分清使用者、付费者、受影响者和代价承担者，确认到底为谁解决什么问题。
    file: object-calibration.md
    purpose: 区分服务对象、受影响者、代价承担者与现实响应者，确定一个会改变判断的最小证据入口。
    use_when:
      - 对象被混在一起
      - 内部想象替代现实对象证据
      - 不同群体承担收益和代价
    do_not_use_when:
      - 对象和现实证据入口已经清楚
      - 只是需要更多背景而非改变决定
    inputs:
      - 暂定真实目的
      - 涉及的对象及已有证据
    outputs:
      - 对象关系和关键证据入口
    relationships:
      - 与基础分析的证据分层部分重叠，只在对象本身不清时提供独立价值
    provenance:
      type: adapted
      source: SamadhiFire/xinqingnian-maoxuan-skill
      commit: 4382484d8a4867f0bf9a6d089e04939618943dfb
      file: references/methods/investigation.md
      license: MIT
    test_status: covered-in-v0.1.5-fixtures
  - id: system-bottleneck
    name: 系统瓶颈
    user_explanation: 多个问题互相牵制时，分清表面症状和真正牵动全局的约束。
    file: system-bottleneck.md
    purpose: 在多个问题相互牵制时，区分表面症状、主导约束与现实控制点。
    use_when:
      - 至少两个问题相互作用
      - 单点处理无法解释结果
      - 名义责任与现实控制点错位
    do_not_use_when:
      - 只有一个清楚瓶颈
      - 普通人际摩擦可直接处理
    inputs:
      - 问题之间的依赖
      - 可观察结果和控制点
    outputs:
      - 当前主导约束及转移阈值
    relationships:
      - 先重构系统问题结构，再由基础分析选择唯一关键变量
    provenance:
      type: adapted
      source: SamadhiFire/xinqingnian-maoxuan-skill
      commit: 4382484d8a4867f0bf9a6d089e04939618943dfb
      file: references/methods/core-contradiction.md
      license: MIT
    test_status: covered-in-v0.1.5-fixtures
  - id: stage-fit
    name: 阶段匹配
    user_explanation: 判断外部条件是否已经变化，以及过去有效的策略还适不适合现在。
    file: stage-fit.md
    purpose: 用联动信号判断条件是否转变，并相应重排当前判断标准。
    use_when:
      - 过去有效策略持续失效
      - 存在过渡、收缩、交接或新阶段信号
    do_not_use_when:
      - 只有单次波动
      - 仅凭主观感受宣布转段
    inputs:
      - 过去和当前条件
      - 至少两组变化信号
    outputs:
      - 当前阶段、依据、改变的决策标准和复判阈值
    relationships:
      - 与 evidence-loop 重叠时，已有执行结果优先用 evidence-loop
    provenance:
      type: adapted
      source: SamadhiFire/xinqingnian-maoxuan-skill
      commit: 4382484d8a4867f0bf9a6d089e04939618943dfb
      file: references/methods/stage-judgment.md
      license: MIT
    test_status: covered-in-v0.1.5-fixtures
  - id: resource-leverage
    name: 资源支点
    user_explanation: 时间、资金或能力有限时，找出最值得集中投入的位置和承诺边界。
    file: resource-leverage.md
    purpose: 盘点资源、依赖与供给瓶颈，识别可持续支点和承诺边界。
    use_when:
      - 多线竞争同一有限资源
      - 供给或关键依赖限制选择
      - 资源被平均铺开
    do_not_use_when:
      - 资源充足且任务单一
      - 服务对象尚未校准
    inputs:
      - 时间、资金、能力和依赖
      - 真实资源上限
    outputs:
      - 关键支点、保底能力、暂缓方向和重配阈值
    relationships:
      - 不生成完整执行路线；B 仍只给一个现实实验
    provenance:
      type: adapted
      source: SamadhiFire/xinqingnian-maoxuan-skill
      commit: 4382484d8a4867f0bf9a6d089e04939618943dfb
      file: references/methods/forces-resources.md
      license: MIT
    test_status: covered-in-v0.1.5-fixtures
  - id: boundary-contracts
    name: 边界契约
    user_explanation: 把合作中的责任、投入、决定权、承诺和退出条件说清楚并变得可检验。
    file: boundary-contracts.md
    purpose: 把合作意愿转为可观察的目标、权责、投入、授权和退出条件。
    use_when:
      - 合作或关系中的权责不清
      - 承诺、现实控制权和退出机制不一致
    do_not_use_when:
      - 存在即时危险、胁迫或跟踪风险
      - 用户要求操控或读心
    inputs:
      - 可观察行为与明确承诺
      - 权责、投入和退出条件
    outputs:
      - 可检验的合作边界和复判条件
    relationships:
      - 危险信号优先安全边界，不做对称合作分析
    provenance:
      type: adapted
      source: SamadhiFire/xinqingnian-maoxuan-skill
      commit: 4382484d8a4867f0bf9a6d089e04939618943dfb
      file: references/methods/alliance-boundaries.md
      license: MIT
    test_status: covered-in-v0.1.5-fixtures
  - id: communication-fit
    name: 沟通匹配
    user_explanation: 判断已经清楚后，让信息、证据、渠道和反馈方式适合对象与目的。
    file: communication-fit.md
    purpose: 在判断已清楚但沟通可能失配时，使信息、证据、渠道和反馈入口服务真实目的。
    use_when:
      - 表达方式会影响决定落地
      - 受众需要不同的相关信息或可访问形式
    do_not_use_when:
      - 事实、对象或判断尚未稳定
      - 用户想按弱点操控、隐瞒或施压
    inputs:
      - 沟通目的、对象和已有判断
    outputs:
      - 核心信息、证据、边界、渠道和反馈入口
    relationships:
      - 不替代结构修复，也不自动生成完整传播方案
    provenance:
      type: adapted
      source: SamadhiFire/xinqingnian-maoxuan-skill
      commit: 4382484d8a4867f0bf9a6d089e04939618943dfb
      file: references/methods/communication-calibration.md
      license: MIT
    test_status: covered-in-v0.1.5-fixtures
  - id: evidence-loop
    name: 证据闭环
    user_explanation: 把原目标和假设与已经发生的结果对齐，重新判断继续、调整、暂停还是停止。
    file: evidence-loop.md
    purpose: 把原目标和判断与实际结果、成本及意外后果对齐，区分判断错误、执行偏差、资源错配和条件变化。
    use_when:
      - 事项已经产生真实结果或偏差
      - 需要决定继续、调整、暂停或停止
    do_not_use_when:
      - 尚未开始且没有现实结果
      - 正在紧急处置
      - 只有情绪归因而无可观察结果
    inputs:
      - 原目标、原假设、成功标准
      - 实际结果、成本和外部变化
    outputs:
      - 偏差机制、保留或改变的判断依据和复判阈值
    relationships:
      - 与 stage-fit 重叠时，本卡优先解释已执行结果；阶段变化只是可能原因之一
    provenance:
      type: adapted
      source: SamadhiFire/xinqingnian-maoxuan-skill
      commit: 4382484d8a4867f0bf9a6d089e04939618943dfb
      file: references/methods/review-loop.md
      license: MIT
    test_status: covered-in-v0.1.5-fixtures
